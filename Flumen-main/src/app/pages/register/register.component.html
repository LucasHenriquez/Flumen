<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <a routerLink="/" class="brand-logo">💧 FLUMEN</a>
      <h2>Crear Cuenta</h2>
      <p>Comienza a registrar y calcular canales de riego</p>
    </div>

    <form (ngSubmit)="onRegister()">
      <div class="form-group">
        <label for="name">Nombre Completo</label>
        <input 
          type="text" 
          id="name" 
          [(ngModel)]="userData.name" 
          name="name" 
          placeholder="Juan Pérez" 
          required 
        />
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input 
          type="email" 
          id="email" 
          [(ngModel)]="userData.email" 
          name="email" 
          placeholder="juan.perez@ejemplo.cl" 
          required 
        />
      </div>

      <div class="form-group">
        <label for="role">Cargo u Ocupación</label>
        <select id="role" [(ngModel)]="userData.role" name="role">
          <option value="tecnico">Técnico Agrícola</option>
          <option value="canalista">Asociación de Canalistas</option>
          <option value="estudiante">Estudiante / Investigador</option>
        </select>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          [(ngModel)]="userData.password" 
          name="password" 
          placeholder="Mínimo 6 caracteres" 
          required 
        />
      </div>

      <button type="submit" class="btn btn-primary btn-block">Crear Cuenta</button>
    </form>

    <div class="auth-footer">
      <span>¿Ya tienes una cuenta?</span>
      <a routerLink="/login">Inicia sesión</a>
    </div>
  </div>
</div>
