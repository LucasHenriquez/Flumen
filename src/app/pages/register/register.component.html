<div class="auth-wrapper">
  <!-- NAVBAR REUTILIZABLE -->
  <app-navbar></app-navbar>

  <!-- VIDEO DE FONDO Y OVERLAY -->
  <div class="video-container">
    <video autoplay [muted]="true" loop playsinline preload="auto" class="bg-video">
      <source src="videos/flumen-hero-landing-page.mp4" type="video/mp4">
      <source src="/videos/flumen-hero-landing-page.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>
  </div>

  <!-- TARJETA CORPORATIVA DE REGISTRO CON LOGO FLUMEN -->
  <main class="auth-card">
    <header class="auth-header">
      <div class="brand-logo-only">
        <img src="public/media/logo-flumen.png" alt="Flumen Logo" class="logo-img" />
      </div>
      <p class="auth-subtitle">Crear Cuenta Corporativa</p>
    </header>

    <!-- MENSAJES DE ESTADO -->
    <div *ngIf="errorMessage" class="alert error" role="alert">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span>{{ errorMessage }}</span>
    </div>

    <div *ngIf="successMessage" class="alert success" role="alert">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
        <polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
      <span>{{ successMessage }}</span>
    </div>

    <!-- FORMULARIO DE REGISTRO -->
    <form (ngSubmit)="onRegister()" class="auth-form" autocomplete="on">
      <div class="form-group">
        <label for="reg-name">Nombre Completo</label>
        <div class="input-wrapper">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input 
            id="reg-name"
            type="text" 
            [(ngModel)]="userData.nombre" 
            name="nombre" 
            placeholder="Juan Pérez" 
            required />
        </div>
      </div>

      <div class="form-group">
        <label for="reg-email">Correo Electrónico</label>
        <div class="input-wrapper">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input 
            id="reg-email"
            type="email" 
            [(ngModel)]="userData.email" 
            name="email" 
            placeholder="juan.perez@ejemplo.cl" 
            required />
        </div>
      </div>

      <div class="form-group">
        <label for="reg-cargo">Cargo u Ocupación</label>
        <div class="input-wrapper">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
          </svg>
          <select id="reg-cargo" [(ngModel)]="userData.cargo" name="cargo">
            <option value="Técnico Agrícola">Técnico Agrícola</option>
            <option value="Administrador">Administrador</option>
            <option value="Regador / Operador">Regador / Operador</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="reg-password">Contraseña</label>
        <div class="input-wrapper">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input 
            id="reg-password"
            type="password" 
            [(ngModel)]="userData.password" 
            name="password" 
            placeholder="Mínimo 6 caracteres" 
            required />
        </div>
      </div>

      <button type="button" class="btn-primary" (click)="onRegister()" [disabled]="loading">
        <span *ngIf="!loading">Crear Cuenta</span>
        <span *ngIf="loading" class="spinner-container">
          <span class="spinner"></span>
          Guardando en MongoDB...
        </span>
      </button>
    </form>

    <footer class="auth-footer">
      <p class="register-prompt">
        ¿Ya tienes cuenta? 
        <a routerLink="/login">Inicia Sesión</a>
      </p>
      <div class="security-tag">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <span>Conexión cifrada de alta seguridad</span>
      </div>
    </footer>
  </main>
</div>
