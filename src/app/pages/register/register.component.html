<!-- NAVBAR SUPERIOR -->
<app-navbar></app-navbar>

<div class="auth-wrapper">
  <!-- VIDEO DE FONDO Y OVERLAY -->
  <div class="video-container">
    <video autoplay muted loop playsinline preload="auto" class="bg-video">
      <source src="/videos/flumen-hero-landing-page.mp4" type="video/mp4">
      <source src="/videos/flumen-hero-landing-page.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>
  </div>

  <!-- TARJETA CORPORATIVA CENTRADA -->
  <main class="auth-card animate-fade-in-up">
    <header class="auth-header">
      <div class="brand-logo-only">
        <img src="/media/logo-flumen.png" alt="Flumen Logo" class="logo-img" />
      </div>
      <h2>Crear Cuenta de Regante</h2>
      <p class="auth-subtitle">Acceso a cubicaciones hidráulicas, historial de turnos y emisión de comprobantes.</p>
    </header>

    <!-- BANNER DINÁMICO DE ALERTAS -->
    <div *ngIf="notificacion" class="notif-banner" [ngClass]="notificacion.tipo" role="alert">
      <span class="notif-icon">
        <svg *ngIf="notificacion.tipo === 'exito'" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M20 6L9 17l-5-5"/>
        </svg>
        <svg *ngIf="notificacion.tipo === 'error'" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="12" cy="12" r="10"/>
          <line x1="15" y1="9" x2="9" y2="15"/>
          <line x1="9" y1="9" x2="15" y2="15"/>
        </svg>
        <svg *ngIf="notificacion.tipo === 'aviso'" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </span>
      <span>{{ notificacion.mensaje }}</span>
    </div>

    <!-- FORMULARIO DE REGISTRO -->
    <form (ngSubmit)="onRegister()" class="auth-form" autocomplete="on">
      <!-- NOMBRE COMPLETO -->
      <div class="form-group">
        <label for="nombre">Nombre Completo *</label>
        <div class="input-wrapper">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input 
            type="text" 
            id="nombre" 
            name="nombre" 
            [(ngModel)]="userData.nombre" 
            placeholder="Ej: Pedro Morales Silva" 
            [disabled]="cargando"
            autocomplete="name"
            required 
          />
        </div>
      </div>

      <!-- CORREO ELECTRÓNICO -->
      <div class="form-group">
        <label for="correo">Correo Electrónico *</label>
        <div class="input-wrapper">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input 
            type="email" 
            id="correo" 
            name="correo" 
            [(ngModel)]="userData.correo" 
            placeholder="pedro.morales@ejemplo.cl" 
            [disabled]="cargando"
            autocomplete="email"
            required 
          />
        </div>
      </div>

      <!-- CONFIRMAR CORREO ELECTRÓNICO -->
      <div class="form-group">
        <label for="confirmCorreo">Confirmar Correo Electrónico *</label>
        <div class="input-wrapper">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input 
            type="email" 
            id="confirmCorreo" 
            name="confirmCorreo" 
            [(ngModel)]="confirmCorreo" 
            placeholder="Repite tu correo corporativo" 
            [disabled]="cargando"
            autocomplete="email"
            required 
          />
        </div>
      </div>

      <!-- OCUPACIÓN / CARGO -->
      <div class="form-group">
        <label for="ocupacion">Actividad / Ocupación en el Canal</label>
        <div class="input-wrapper">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
          </svg>
          <select id="ocupacion" name="ocupacion" [(ngModel)]="userData.ocupacion" [disabled]="cargando">
            <option *ngFor="let o of ocupaciones" [value]="o.valor">{{ o.etiqueta }}</option>
          </select>
        </div>
      </div>

      <!-- CONTRASEÑA -->
      <div class="form-group">
        <label for="password">Contraseña de Acceso *</label>
        <div class="input-wrapper">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input 
            [type]="mostrarPassword ? 'text' : 'password'" 
            id="password" 
            name="password" 
            [(ngModel)]="userData.password" 
            placeholder="Mínimo 6 caracteres" 
            [disabled]="cargando"
            autocomplete="new-password"
            required 
          />
          <button 
            type="button" 
            class="btn-toggle-pass" 
            (click)="mostrarPassword = !mostrarPassword"
            aria-label="Alternar visibilidad de contraseña">
            <svg *ngIf="!mostrarPassword" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="mostrarPassword" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- CONFIRMAR CONTRASEÑA -->
      <div class="form-group">
        <label for="confirmPassword">Confirmar Contraseña *</label>
        <div class="input-wrapper">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input 
            [type]="mostrarConfirmPassword ? 'text' : 'password'" 
            id="confirmPassword" 
            name="confirmPassword" 
            [(ngModel)]="confirmPassword" 
            placeholder="Repite tu contraseña" 
            [disabled]="cargando"
            autocomplete="new-password"
            required 
          />
          <button 
            type="button" 
            class="btn-toggle-pass" 
            (click)="mostrarConfirmPassword = !mostrarConfirmPassword"
            aria-label="Alternar visibilidad de confirmación de contraseña">
            <svg *ngIf="!mostrarConfirmPassword" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="mostrarConfirmPassword" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-agro-submit" [disabled]="cargando">
        <span *ngIf="!cargando">Registrar Cuenta</span>
        <span *ngIf="cargando" class="btn-spinner">
          <span class="spinner-ring"></span> Guardando en MongoDB...
        </span>
      </button>
    </form>

    <footer class="auth-footer">
      <span>¿Ya tienes una cuenta registrada?</span>
      <a routerLink="/login">Inicia sesión aquí</a>
    </footer>
  </main>
</div>
