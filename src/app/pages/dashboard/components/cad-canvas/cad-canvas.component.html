<div class="cad-card-container">
  <header class="cad-toolbar">
    <div class="toolbar-title">
      <div class="title-with-badge">
        <h4>Plano Topográfico &bull; Vector CAD</h4>
        <span class="scale-indicator">Escala 1:1000</span>
      </div>
      <p>Lienzo paramétrico vectorial de alta precisión. Arrastre fluido sin saltos de posición.</p>
    </div>
    
    <div class="topographic-legend">
      <span class="legend-item"><span class="dot-color dot-matriz"></span> Canal Matriz</span>
      <span class="legend-item"><span class="dot-color dot-regadera"></span> Canaleta (Arrastrar)</span>
      <span class="legend-item"><span class="dot-color dot-compuerta-on"></span> Abierta</span>
      <span class="legend-item"><span class="dot-color dot-compuerta-off"></span> Cerrada</span>
      <span class="legend-item"><span class="dot-color dot-curva"></span> Curvas de Nivel</span>
    </div>
  </header>

  <div class="canvas-viewport" #canvasWrapper>
    <svg #svgElement class="cad-svg" viewBox="0 0 1100 680" preserveAspectRatio="xMidYMid meet">
      <defs>
        <pattern id="cad-cross-grid" width="35" height="35" patternUnits="userSpaceOnUse">
          <path d="M 17.5 14 L 17.5 21 M 14 17.5 L 21 17.5" stroke="rgba(255, 255, 255, 0.07)" stroke-width="0.9"/>
        </pattern>

        <filter id="shadow-terraplen-pro" x="-12%" y="-12%" width="128%" height="128%">
          <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#000000" flood-opacity="0.85"/>
        </filter>

        <linearGradient id="relief-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
          <stop offset="100%" stop-color="rgba(0,0,0,0.4)"/>
        </linearGradient>

        <pattern id="crop-texture-pro" width="20" height="20" patternUnits="userSpaceOnUse">
          <line x1="0" y1="10" x2="20" y2="10" stroke="rgba(255,255,255,0.07)" stroke-width="1.8" stroke-dasharray="3,4"/>
          <circle cx="10" cy="10" r="1.4" fill="rgba(255,255,255,0.1)"/>
        </pattern>

        <linearGradient id="stream-matriz-grad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#0284c7"/>
          <stop offset="50%" stop-color="#38bdf8"/>
          <stop offset="100%" stop-color="#0284c7"/>
        </linearGradient>

        <linearGradient id="stream-matriz-vert" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#0284c7"/>
          <stop offset="50%" stop-color="#38bdf8"/>
          <stop offset="100%" stop-color="#0284c7"/>
        </linearGradient>

        <marker id="stream-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
          <path d="M 0 2 L 7 5 L 0 8 z" fill="#38bdf8"/>
        </marker>
      </defs>

      <!-- 1. RETÍCULA -->
      <rect width="100%" height="100%" fill="url(#cad-cross-grid)" pointer-events="none"></rect>

      <!-- 2. COTA SUPERIOR -->
      <g class="layer-cota" pointer-events="none">
        <line [attr.x1]="geom.x" y1="28" [attr.x2]="geom.x + geom.w" y2="28" stroke="#334155" stroke-width="1.2" stroke-dasharray="4,4"/>
        <line [attr.x1]="geom.x" y1="21" [attr.x2]="geom.x" y2="35" stroke="#64748b" stroke-width="1.5"/>
        <line [attr.x1]="geom.x + geom.w" y1="21" [attr.x2]="geom.x + geom.w" y2="35" stroke="#64748b" stroke-width="1.5"/>

        <g [attr.transform]="'translate(' + (geom.x + geom.w / 2) + ', 28)'">
          <rect x="-85" y="-13" width="170" height="26" rx="5" fill="#09121d" stroke="#334155" stroke-width="1"/>
          <text x="0" y="4" text-anchor="middle" class="mono-cota">&harr; ANCHO: {{ anchoM }} METROS</text>
        </g>
      </g>

      <!-- 3. TERRENO BASE -->
      <rect 
        [attr.x]="geom.x" 
        [attr.y]="geom.y + 8" 
        [attr.width]="geom.w" 
        [attr.height]="geom.h" 
        rx="14" 
        fill="rgba(0,0,0,0.75)"
        filter="url(#shadow-terraplen-pro)"
        pointer-events="none"
      />

      <rect 
        [attr.x]="geom.x" 
        [attr.y]="geom.y" 
        [attr.width]="geom.w" 
        [attr.height]="geom.h" 
        rx="14" 
        [attr.fill]="cultivo.colorSuelo"
        class="terraplen-body"
      />

      <rect [attr.x]="geom.x" [attr.y]="geom.y" [attr.width]="geom.w" [attr.height]="geom.h" rx="14" fill="url(#relief-gradient)" pointer-events="none"/>
      <rect [attr.x]="geom.x" [attr.y]="geom.y" [attr.width]="geom.w" [attr.height]="geom.h" rx="14" fill="url(#crop-texture-pro)" pointer-events="none"/>

      <!-- Vértices -->
      <g class="vertices-cartograficos" pointer-events="none">
        <text [attr.x]="geom.x + 10" [attr.y]="geom.y + 16">V1 [0,0]</text>
        <text [attr.x]="geom.x + geom.w - 110" [attr.y]="geom.y + 16">V2 +{{ anchoM }}m E</text>
        <text [attr.x]="geom.x + 10" [attr.y]="geom.y + geom.h - 10">V3 +{{ largoM }}m S</text>
        <text [attr.x]="geom.x + geom.w - 110" [attr.y]="geom.y + geom.h - 10">V4 REF-G104</text>
      </g>

      <!-- 4. CURVAS DE NIVEL -->
      <g class="curvas-nivel-group" pointer-events="none">
        <path [attr.d]="curvaNivel(0.28)" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.2" stroke-dasharray="5,4"/>
        <text [attr.x]="geom.x + 20" [attr.y]="geom.y + geom.h * 0.28 - 5" class="topo-cota-txt">Cota +102.5 m</text>

        <path [attr.d]="curvaNivel(0.58)" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.2" stroke-dasharray="5,4"/>
        <text [attr.x]="geom.x + 20" [attr.y]="geom.y + geom.h * 0.58 - 5" class="topo-cota-txt">Cota +101.8 m</text>

        <path [attr.d]="curvaNivel(0.85)" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.2" stroke-dasharray="5,4"/>
        <text [attr.x]="geom.x + 20" [attr.y]="geom.y + geom.h * 0.85 - 5" class="topo-cota-txt">Cota +101.0 m</text>
      </g>

      <!-- 5. SUBDIVISIÓN POR CUARTELES -->
      <g class="cuarteles-group" pointer-events="none">
        <ng-container *ngFor="let l of lineasDivision">
          <line 
            [attr.x1]="l.x1" [attr.y1]="l.y1" 
            [attr.x2]="l.x2" [attr.y2]="l.y2" 
            stroke="rgba(255, 255, 255, 0.65)" 
            stroke-width="1.8" 
            stroke-dasharray="6, 5"
          />
        </ng-container>

        <ng-container *ngFor="let c of sectoresCuarteles">
          <g [attr.transform]="'translate(' + c.posX + ',' + c.posY + ')'">
            <rect x="-70" y="-20" width="140" height="40" rx="8" fill="rgba(8, 14, 20, 0.88)" stroke="rgba(255,255,255,0.2)"/>
            <text x="0" y="-3" text-anchor="middle" class="cuartel-title">{{ c.nombre }}</text>
            <text x="0" y="12" text-anchor="middle" class="cuartel-sub">{{ c.superficieHa }} Ha &bull; {{ c.estado }}</text>
          </g>
        </ng-container>
      </g>

      <!-- 6. CANAL MATRIZ -->
      <g class="canal-matriz-group" 
         (mousedown)="iniciarArrastreCanalMatriz($event)"
         title="Arrastra para mover el canal matriz">
        
        <ng-container *ngIf="ubicacionCanal === 'norte' || ubicacionCanal === 'sur'">
          <rect 
            [attr.x]="geom.x - 25" 
            [attr.y]="canalMatrizPosCalculada" 
            [attr.width]="geom.w + 50" 
            height="28" 
            rx="6" 
            fill="url(#stream-matriz-grad)"
            class="canal-matriz-mesh"
          />
          <text 
            [attr.x]="geom.x + (geom.w / 2)" 
            [attr.y]="canalMatrizPosCalculada + 18" 
            text-anchor="middle" 
            class="canal-matriz-text" 
            pointer-events="none">
            &rarr; ACEQUIA MATRIZ &bull; {{ caudalLps }} L/s &bull; n={{ rugosidadManning }} &rarr;
          </text>
        </ng-container>

        <ng-container *ngIf="ubicacionCanal === 'oeste' || ubicacionCanal === 'este'">
          <rect 
            [attr.x]="canalMatrizPosCalculada" 
            [attr.y]="geom.y - 25" 
            width="28" 
            [attr.height]="geom.h + 50" 
            rx="6" 
            fill="url(#stream-matriz-vert)"
            class="canal-matriz-mesh"
          />
          <g [attr.transform]="'translate(' + (canalMatrizPosCalculada + 18) + ',' + (geom.y + (geom.h / 2)) + ') rotate(-90)'" pointer-events="none">
            <text x="0" y="0" text-anchor="middle" class="canal-matriz-text">
              &rarr; ACEQUIA MATRIZ &bull; {{ caudalLps }} L/s &bull; n={{ rugosidadManning }} &rarr;
            </text>
          </g>
        </ng-container>
      </g>

      <!-- 7. CANALETAS SECUNDARIAS -->
      <g class="regaderas-group">
        <ng-container *ngFor="let can of canaletas; let idx = index; trackBy: trackByCanaleta">
          
          <g *ngIf="orientacionRegaderas === 'vertical'">
            <line 
              [attr.x1]="can.posicion" [attr.y1]="geom.y" 
              [attr.x2]="can.posicion" [attr.y2]="geom.y + geom.h" 
              stroke="#040910" stroke-width="7" pointer-events="none"
            />
            
            <line 
              [attr.x1]="can.posicion" [attr.y1]="geom.y" 
              [attr.x2]="can.posicion" [attr.y2]="geom.y + geom.h - 14" 
              class="water-stream-flow"
              [class.closed]="can.abierta === false"
              marker-end="url(#stream-arrow)"
              pointer-events="none"
            />

            <line 
              [attr.x1]="can.posicion" [attr.y1]="geom.y" 
              [attr.x2]="can.posicion" [attr.y2]="geom.y + geom.h" 
              stroke="transparent" 
              stroke-width="36"
              class="hitbox-drag-v"
              title="Arrastrar canaleta a los lados"
              (mousedown)="iniciarArrastreCanaleta(idx, $event)"
            />

            <!-- Compuerta -->
            <g class="compuerta-wrapper" [attr.transform]="'translate(' + can.posicion + ',' + (geom.y + 4) + ')'">
              <rect x="-10" y="-4" width="20" height="8" rx="2" fill="#0b1320" stroke="#475569" stroke-width="1"/>
              <circle 
                cy="0" 
                r="7.5" 
                [attr.fill]="can.abierta !== false ? '#10b981' : '#ef4444'"
                stroke="#ffffff" 
                stroke-width="2" 
                class="compuerta-handle"
                title="Clic para Abrir / Cerrar"
                (click)="toggleCompuerta(idx, $event)"
              />
            </g>

            <!-- Botón Eliminar -->
            <g class="btn-del-group" [attr.transform]="'translate(' + can.posicion + ',' + (geom.y + geom.h + 16) + ')'">
              <circle r="8.5" class="btn-del-bg" (click)="onEliminarCanaleta(idx, $event)" title="Eliminar canaleta"/>
              <text y="3.5" text-anchor="middle" class="txt-x" pointer-events="none">&times;</text>
            </g>
          </g>

          <g *ngIf="orientacionRegaderas === 'horizontal'">
            <line 
              [attr.x1]="geom.x" [attr.y1]="can.posicion" 
              [attr.x2]="geom.x + geom.w" [attr.y2]="can.posicion" 
              stroke="#040910" stroke-width="7" pointer-events="none"
            />
            <line 
              [attr.x1]="geom.x" [attr.y1]="can.posicion" 
              [attr.x2]="geom.x + geom.w - 14" [attr.y2]="can.posicion" 
              class="water-stream-flow"
              [class.closed]="can.abierta === false"
              marker-end="url(#stream-arrow)"
              pointer-events="none"
            />

            <line 
              [attr.x1]="geom.x" [attr.y1]="can.posicion" 
              [attr.x2]="geom.x + geom.w" [attr.y2]="can.posicion" 
              stroke="transparent" 
              stroke-width="36"
              class="hitbox-drag-h"
              (mousedown)="iniciarArrastreCanaleta(idx, $event)"
            />

            <g class="compuerta-wrapper" [attr.transform]="'translate(' + (geom.x + 4) + ',' + can.posicion + ')'">
              <rect x="-4" y="-10" width="8" height="20" rx="2" fill="#0b1320" stroke="#475569" stroke-width="1"/>
              <circle 
                cx="0" 
                r="7.5" 
                [attr.fill]="can.abierta !== false ? '#10b981' : '#ef4444'"
                stroke="#ffffff" 
                stroke-width="2" 
                class="compuerta-handle"
                (click)="toggleCompuerta(idx, $event)"
              />
            </g>

            <g class="btn-del-group" [attr.transform]="'translate(' + (geom.x + geom.w + 16) + ',' + can.posicion + ')'">
              <circle r="8.5" class="btn-del-bg" (click)="onEliminarCanaleta(idx, $event)"/>
              <text y="3.5" text-anchor="middle" class="txt-x" pointer-events="none">&times;</text>
            </g>
          </g>

        </ng-container>
      </g>

      <!-- 8. COTA DE LARGO -->
      <g class="layer-cota" pointer-events="none">
        <line [attr.x1]="geom.x + geom.w + 24" [attr.y1]="geom.y" [attr.x2]="geom.x + geom.w + 24" [attr.y2]="geom.y + geom.h" stroke="#334155" stroke-width="1.2" stroke-dasharray="4,4"/>
        <line [attr.x1]="geom.x + geom.w + 17" [attr.y1]="geom.y" [attr.x2]="geom.x + geom.w + 31" [attr.y2]="geom.y" stroke="#64748b" stroke-width="1.5"/>
        <line [attr.x1]="geom.x + geom.w + 17" [attr.y1]="geom.y + geom.h" [attr.x2]="geom.x + geom.w + 31" [attr.y2]="geom.y + geom.h" stroke="#64748b" stroke-width="1.5"/>

        <g [attr.transform]="'translate(' + (geom.x + geom.w + 34) + ',' + (geom.y + (geom.h / 2)) + ') rotate(90)'">
          <rect x="-75" y="-13" width="150" height="26" rx="5" fill="#09121d" stroke="#334155" stroke-width="1"/>
          <text x="0" y="4" text-anchor="middle" class="mono-cota">&harr; LARGO: {{ largoM }} M</text>
        </g>
      </g>

      <!-- 9. BADGE DE PENDIENTE -->
      <g [attr.transform]="'translate(' + (geom.x + geom.w - 125) + ',' + (geom.y + 14) + ')'" pointer-events="none">
        <rect width="112" height="26" rx="5" fill="rgba(6, 12, 20, 0.92)" stroke="rgba(255,255,255,0.22)"/>
        <text x="56" y="17" text-anchor="middle" [attr.fill]="pendientePorc >= 0.05 ? '#38bdf8' : '#f87171'" class="mono-slope">
          &searr; S = {{ pendientePorc }}%
        </text>
      </g>

      <!-- 10. TIRADORES DE ESCALA CAD FIJOS AL BORDE PERIMETRAL EXTERIOR -->
      <!-- Tirador Este (Ancho) montado al costado derecho del borde -->
      <g [attr.transform]="'translate(' + (geom.x + geom.w) + ',' + (geom.y + (geom.h / 2)) + ')'"
         class="cad-handle ew-resize"
         (mousedown)="iniciarArrastreTerreno('terreno-width', $event)">
        <rect x="0" y="-30" width="24" height="60" fill="transparent" />
        <rect x="2" y="-18" width="6" height="36" rx="3" fill="#38bdf8" stroke="#09121d" stroke-width="1.5" />
        <line x1="5" y1="-8" x2="5" y2="8" stroke="#ffffff" stroke-width="1.5" />
      </g>

      <!-- Tirador Sur (Largo) montado al costado inferior del borde -->
      <g [attr.transform]="'translate(' + (geom.x + (geom.w / 2)) + ',' + (geom.y + geom.h) + ')'"
         class="cad-handle ns-resize"
         (mousedown)="iniciarArrastreTerreno('terreno-height', $event)">
        <rect x="-30" y="0" width="60" height="24" fill="transparent" />
        <rect x="-18" y="2" width="36" height="6" rx="3" fill="#38bdf8" stroke="#09121d" stroke-width="1.5" />
        <line x1="-8" y1="5" x2="8" y2="5" stroke="#ffffff" stroke-width="1.5" />
      </g>

      <!-- Tirador Esquina Sureste (Diagonal) -->
      <g [attr.transform]="'translate(' + (geom.x + geom.w) + ',' + (geom.y + geom.h) + ')'"
         class="cad-handle corner-resize"
         (mousedown)="iniciarArrastreTerreno('terreno-corner', $event)">
        <circle cx="0" cy="0" r="18" fill="transparent" />
        <circle cx="0" cy="0" r="7.5" fill="#f59e0b" stroke="#09121d" stroke-width="2" />
        <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
      </g>
    </svg>
  </div>
</div>
